name: smart_tour
description: SmartTour Pro MVP - AI powered travel companion.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  json_annotation: ^4.9.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  just_audio: ^0.10.4
  http: ^1.4.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  camera: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^3.0.3
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
